<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonura's Bank · Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <div class="page">
        <main class="card">
            <header class="bar">
                <span class="brand">
                    <span class="brand__dot" aria-hidden="true"></span>Bonura's Bank
                </span>
                <span class="tag">Home</span>
            </header>

            <h1 class="hero__title">hi</h1>
            <p class="hero__subtitle">do you want to&hellip;</p>

            <nav class="actions" aria-label="Main actions">
                <button type="button" class="btn btn--primary" onclick="window.location.href='/addaccount.html'">
                    Add account
                </button>
                <button type="button" class="btn btn--primary" onclick="window.location.href='/getusers.html'">
                    Query accounts
                </button>
                <button type="button" class="btn btn--primary" onclick="window.location.href='/add_admin.html'">
                    Add admin
                </button>
                <button type="button" class="btn btn--primary" onclick="window.location.href='/login_admin.html'">
                    Admin login
                </button>
                <button type="button" class="btn btn--primary" onclick="window.location.href='/transaction1.html'">
                    Transaction
                </button>
                <button type="button" id="getcurrentadmin" class="btn btn--primary">
                    Get current admin
                </button>
                <button type="button" id="viewstudents" class="btn btn--primary">
                    View students
                </button>
            </nav>

            <div id="currentadminresults" class="results" role="status" aria-live="polite"
                 data-empty="No admin looked up yet &mdash; press &ldquo;Get current admin&rdquo; to ask the backend which admin this browser is signed in as."></div>

            <!-- View students: app.js draws one bar per student of the logged-in
                 admin here &mdash; balance up the y axis, ticked every 20, and the
                 student name along the x axis. Hidden until the button is pressed. -->
            <section id="studentchart" class="chart" aria-labelledby="studentcharttitle" hidden>
                <h2 class="chart__title" id="studentcharttitle">Student balances</h2>
                <p id="studentchartstatus" class="chart__status" role="status" aria-live="polite">
                    Press &ldquo;View students&rdquo; to draw the balances of the students that name the signed-in admin as their supervisor.
                </p>

                <div id="studentchartframe" class="chart__frame" hidden>
                    <div id="studentchartscale" class="chart__scale" aria-hidden="true"></div>
                    <div id="studentchartplot" class="chart__plot"></div>
                    <div class="chart__corner" aria-hidden="true"></div>
                    <div id="studentchartnames" class="chart__names"></div>
                </div>
            </section>

            <p class="footnote">Static pages talking to <code>api.rongrongwu.com</code>.</p>
        </main>
    </div>
</body>
</html>
