<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonura bank · Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap">
    <link rel="stylesheet" href="styles.css?v=7">
    <script src="app.js?v=4" defer></script>
</head>
<body>
    <!-- The landing page is one card and nothing else: the bank's name at its top-left,
         a username box and a password box across its middle, and the two sign-in doors
         along its foot with the history door standing under them. app.js's landing
         section is the only thing the card talks to, and "Admin sign in" is the admin
         login there — the same POST /login, with the same admin_name and password
         fields, that login_admin.html sends. The student door has no route behind it
         yet, so it says so when it is pressed. -->
    <div class="page">
        <main class="signin">
            <h1 class="signin__brand">Bonura bank</h1>

            <form id="signinform" class="signin__form">
                <!-- The sketch writes the name of each box inside it, so the placeholder
                     does that visible work and the real <label> is left to the screen
                     reader only (.sr-only). The names are the backend's: POST /login
                     reads admin_name and password — the one login this card can make. -->
                <div class="signin__field">
                    <label class="sr-only" for="admin_name">Username</label>
                    <input type="text" id="admin_name" name="admin_name" placeholder="username"
                           autocomplete="username" required>
                </div>

                <div class="signin__field">
                    <label class="sr-only" for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="password"
                           autocomplete="current-password" required>
                </div>

                <!-- The two doors, side by side at the foot of the card. Admin sign in is
                     the form's submit button, so Enter in either box signs the admin in
                     too; the student button is not a submit, because there is nowhere for
                     it to go yet. -->
                <div class="signin__actions">
                    <button type="button" id="studentsignin" class="btn btn--ink">
                        Student sign in
                    </button>
                    <button type="submit" class="btn btn--ink">
                        Admin sign in
                    </button>
                </div>

                <!-- The third way out of this card, and the one that is not a sign-in: the
                     same history door the students page carries, opening the same page —
                     transaction-view-middle.html, which asks the backend whose session
                     this is before it asks which student to show, so a visitor who is not
                     signed in is told to sign in on the page it opens rather than here. It
                     stands under the two doors but wears the pale treatment of a door
                     rather than their dark ink, the way the hub and the students page draw
                     a door. app.js knows nothing about it: it is a link, and the card's
                     only script is the sign-in the two buttons above send. -->
                <a class="btn btn--door" href="/transaction-view-middle.html">
                    View student transaction history
                </a>
            </form>

            <div id="signinresults" class="results" role="status" aria-live="polite"></div>
        </main>
    </div>
</body>
</html>
