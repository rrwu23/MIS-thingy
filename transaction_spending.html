<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App1 · Select expense</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <div class="page">
        <main class="card">
            <header class="bar">
                <a class="brand" href="/index.html">
                    <span class="brand__dot" aria-hidden="true"></span>Bonura's Bank
                </a>
                <a class="tag" href="/index.html">&#8592; Home</a>
            </header>

            <section class="panel" aria-labelledby="reasontitle">
                <h1 class="panel__title" id="reasontitle">Select expense</h1>

                <!-- data-reason-type tells app.js which /reasons/{slug} list to
                     ask for: it carries the type column value exactly, so "WAYS TO
                     SPEND BONURA BUCKS" asks for
                     /reasons/ways-to-spend-bonura-bucks. The options below are the
                     fallback, kept in the dropdown whenever the backend cannot
                     answer; they are the exact reason column values, each one both
                     the value and the text. The live list comes back with the
                     amounts from the table's amount column: 2 up to 200. -->
                <select id="reason" name="reason" data-reason-type="WAYS TO SPEND BONURA BUCKS" aria-label="Select expense">
                    <option value="" selected>Choose an expense&hellip;</option>
                    <option value="Add pencil">Add pencil</option>
                    <option value="Colouring books">Colouring books</option>
                    <option value="Dress up silly goose">Dress up silly goose</option>
                    <option value="Extra computer time">Extra computer time</option>
                    <option value="Homework pass">Homework pass</option>
                    <option value="Ice cream">Ice cream</option>
                    <option value="Movie">Movie</option>
                    <option value="Pen pass">Pen pass</option>
                    <option value="Phys. ed. game">Phys. ed. game</option>
                    <option value="Popcorn Party">Popcorn Party</option>
                    <option value="Prize Bin">Prize Bin</option>
                    <option value="Pyjama Day">Pyjama Day</option>
                    <option value="Swish or Miss">Swish or Miss</option>
                    <option value="Toy">Toy</option>
                    <option value="Toy car">Toy car</option>
                    <option value="VIP desk (1 day)">VIP desk (1 day)</option>
                    <option value="Yes Day (classroom)">Yes Day (classroom)</option>
                </select>

                <div class="form__actions">
                    <button type="button" class="btn btn--primary" id="reasonnext" aria-disabled="true">
                        Next
                    </button>
                </div>
            </section>

            <div id="reasonresults" class="results" role="status" aria-live="polite"
                 data-empty="Asking the backend for the expense list&hellip;"></div>

            <p class="footnote">Wrong student? <a class="tag" href="/transaction-middle.html">&#8592; Back</a></p>
        </main>
    </div>
</body>
</html>
