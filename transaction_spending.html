<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App1 · Select expense</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <div class="page">
        <main class="card">
            <header class="bar">
                <a class="brand" href="/index.html">
                    <span class="brand__dot" aria-hidden="true"></span>App1
                </a>
                <a class="tag" href="/index.html">&#8592; Home</a>
            </header>

            <section class="panel" aria-labelledby="reasontitle">
                <h1 class="panel__title" id="reasontitle">Select expense</h1>

                <!-- data-reason-type tells app.js which /reasons/{slug} list to
                     ask for: spending -> /reasons/ways-to-spend-bonura-bucks.
                     The second option is the fallback, kept whenever the backend
                     cannot answer. These are things a student can buy, so the
                     amounts are what they cost: 2 up to 200. -->
                <select id="reason" name="reason" data-reason-type="spending" aria-label="Select expense">
                    <option value="" selected>Choose an expense&hellip;</option>
                    <option value="Other expense">Other expense</option>
                </select>

                <div class="form__actions">
                    <button type="button" class="btn btn--primary" id="reasonnext" aria-disabled="true">
                        Next
                    </button>
                </div>
            </section>

            <div id="reasonresults" class="results" role="status" aria-live="polite"
                 data-empty="Asking the backend for the expense list&hellip;"></div>

            <p class="footnote">Wrong student? <a class="tag" href="/transaction-middle.html">&#8592; Back</a></p>
        </main>
    </div>
</body>
</html>
