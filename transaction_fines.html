<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App1 · Select fine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <div class="page">
        <main class="card">
            <header class="bar">
                <a class="brand" href="/index.html">
                    <span class="brand__dot" aria-hidden="true"></span>Bonura's Bank
                </a>
                <a class="tag" href="/index.html">&#8592; Home</a>
            </header>

            <section class="panel" aria-labelledby="reasontitle">
                <h1 class="panel__title" id="reasontitle">Select fine</h1>

                <!-- data-reason-type tells app.js which /reasons/{slug} list to
                     ask for: it carries the type column value exactly, so "BONURA
                     BANK FINES" asks for /reasons/bonura-bank-fines. The options
                     below are the fallback, kept in the dropdown whenever the
                     backend cannot answer; they are the exact reason column values,
                     each one both the value and the text. The live list comes back
                     with the amounts from the table's amount column, all negative:
                     -5, -10, -15. -->
                <select id="reason" name="reason" data-reason-type="BONURA BANK FINES" aria-label="Select fine">
                    <option value="" selected>Choose a fine&hellip;</option>
                    <option value="Bathroom expectation violation">Bathroom expectation violation</option>
                    <option value="Being rude / disrespectful">Being rude / disrespectful</option>
                    <option value="Incomplete homework">Incomplete homework</option>
                    <option value="Off-task behaviour">Off-task behaviour</option>
                    <option value="Speaking out of turn">Speaking out of turn</option>
                    <option value="Untimely socializing">Untimely socializing</option>
                    <option value="Untucked chair">Untucked chair</option>
                </select>

                <div class="form__actions">
                    <button type="button" class="btn btn--primary" id="reasonnext" aria-disabled="true">
                        Next
                    </button>
                </div>
            </section>

            <div id="reasonresults" class="results" role="status" aria-live="polite"
                 data-empty="Asking the backend for the fine list&hellip;"></div>

            <p class="footnote">Wrong student? <a class="tag" href="/transaction-middle.html">&#8592; Back</a></p>
        </main>
    </div>
</body>
</html>
