<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonura bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap">
    <link rel="stylesheet" href="styles.css?v=24">
    <script src="app.js?v=21" defer></script>
</head>
<body>
    <div class="page">
        <main class="card">
            <header class="bar">
                <h1 class="card__title">Bonura bank</h1>
                <a class="tag" href="/home.html">&#8592; Home</a>
            </header>

            <section class="panel" aria-labelledby="reasontitle">
                <!-- The page's own name, which used to be a heading — the card's heading is
                     the bank's name now — kept with the id the panel is labelled by. -->
                <p class="panel__title" id="reasontitle">Select fine</p>

                <!-- data-reason-type tells app.js which /reasons/{slug} list to
                     ask for: it carries the type column value exactly, so "BONURA
                     BANK FINES" asks for /reasons/bonura-bank-fines. The options
                     below are the fallback, kept in the dropdown whenever the
                     backend cannot answer; they are the exact reason column values,
                     each one both the value and the text. The live list comes back
                     with the amounts from the table's amount column, all negative:
                     -5, -10, -15. Fines are money out, so app.js keeps them negative
                     even if the backend ever sends one as a positive. A fallback
                     option above has no amount at all, and nothing is invented. -->
                <select id="reason" name="reason" data-reason-type="BONURA BANK FINES" aria-label="Select fine">
                    <option value="" selected>Choose a fine&hellip;</option>
                    <option value="Bathroom expectation violation">Bathroom expectation violation</option>
                    <option value="Being rude / disrespectful">Being rude / disrespectful</option>
                    <option value="Incomplete homework">Incomplete homework</option>
                    <option value="Off-task behaviour">Off-task behaviour</option>
                    <option value="Speaking out of turn">Speaking out of turn</option>
                    <option value="Untimely socializing">Untimely socializing</option>
                    <option value="Untucked chair">Untucked chair</option>
                </select>

                <!-- The row's date, picked rather than stamped when Next is pressed: the
                     browser's own day-and-clock box — the birthday box on addaccount.html is
                     its plain day side, without the clock — which app.js fills from the clock
                     as the page loads, so it starts at now. Its calendar is how the row is
                     filed under another day: every day of every month is on it, January 1st
                     through December 31st, and the months and years around them are walked
                     by the control itself. app.js re-cuts what it holds into the history
                     page's own Date column shape, YYYY/MM/DD HH:mm — a day it holds with no time
                     on it is filed at 00:00, the time of day being the one part of the stamp
                     this page may leave off — and refuses a box that holds no whole day,
                     saying so on the status line below. -->
                <div class="field">
                    <label for="transactiondate">Date <span class="hint">the day and time it happened</span></label>
                    <input type="datetime-local" id="transactiondate" name="date">
                </div>

                <div class="form__actions">
                    <button type="button" class="btn btn--primary" id="reasonnext" aria-disabled="true">
                        Next
                    </button>
                </div>
            </section>

            <div id="reasonresults" class="results" role="status" aria-live="polite"
                 data-empty="Asking the backend for the fine list&hellip;"></div>

            <p class="footnote">Wrong student? <a class="tag" href="/transaction-middle.html">&#8592; Back</a></p>
        </main>
    </div>
</body>
</html>
