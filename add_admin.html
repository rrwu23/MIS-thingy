<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App1 · Add admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap">
    <link rel="stylesheet" href="styles.css?v=3">
    <script src="app.js?v=2" defer></script>
</head>
<body>
    <div class="page">
        <main class="card">
            <header class="bar">
                <a class="brand" href="/home.html">
                    <span class="brand__dot" aria-hidden="true"></span>Bonura's Bank
                </a>
                <a class="tag" href="/home.html">&#8592; Home</a>
            </header>

            <h1 class="card__title">Add admin</h1>
            <p class="card__hint">Creates an admin login. Both password fields must match.</p>

            <form id="addadminform" class="form">
                <div class="field">
                    <label for="admin_name">Admin name</label>
                    <input type="text" id="admin_name" name="admin_name"
                           autocomplete="username" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           autocomplete="new-password" required>
                </div>

                <div class="field">
                    <label for="retype_password">Retype password</label>
                    <input type="password" id="retype_password" name="retype_password"
                           autocomplete="new-password" required>
                </div>

                <div class="form__actions">
                    <button type="submit" class="btn btn--primary">Submit</button>
                    <button type="reset" class="btn btn--ghost">Clear</button>
                </div>
            </form>

            <!-- The signup is sent to POST /add-admin by app.js, which posts admin_name
                 and password once the two password fields above agree. Its answer lands
                 here: the admin's name on the way out, or the reason nothing was created
                 — a backend refusal, or no admin being signed in at all. -->
            <div id="addadminresults" class="results" role="status" aria-live="polite"
                 data-empty="No admin created yet — fill in both password fields and submit."></div>
        </main>
    </div>
</body>
</html>
