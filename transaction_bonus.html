<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App1 · Select bonus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <div class="page">
        <main class="card">
            <header class="bar">
                <a class="brand" href="/index.html">
                    <span class="brand__dot" aria-hidden="true"></span>Bonura's Bank
                </a>
                <a class="tag" href="/index.html">&#8592; Home</a>
            </header>

            <section class="panel" aria-labelledby="reasontitle">
                <h1 class="panel__title" id="reasontitle">Select bonus</h1>

                <!-- data-reason-type tells app.js which /reasons/{slug} list to
                     ask for. These options are the fallback: they stay in the
                     dropdown whenever the backend cannot answer. -->
                <select id="reason" name="reason" data-reason-type="bonus" aria-label="Select bonus">
                    <option value="" selected>Choose a bonus&hellip;</option>
                    <option value="attendance">Attendance bonus</option>
                    <option value="performance">Performance bonus</option>
                    <option value="volunteer">Volunteer bonus</option>
                    <option value="referral">Referral bonus</option>
                    <option value="other">Other bonus</option>
                </select>

                <div class="form__actions">
                    <button type="button" class="btn btn--primary" id="reasonnext" aria-disabled="true">
                        Next
                    </button>
                </div>
            </section>

            <div id="reasonresults" class="results" role="status" aria-live="polite"
                 data-empty="Asking the backend for the bonus list&hellip;"></div>

            <p class="footnote">Wrong student? <a class="tag" href="/transaction-middle.html">&#8592; Back</a></p>
        </main>
    </div>
</body>
</html>
