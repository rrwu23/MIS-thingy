<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonura bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap">
    <link rel="stylesheet" href="styles.css?v=26">
    <script src="apibase.js?v=1" defer></script>
    <script src="studenthome.js?v=5" defer></script>
</head>
<body>
    <!-- The page behind the front door's student door, and the whole of it is the sketch's
         card: the bank's name, the greeting that names the student who is signed in, the
         question under it, the two doors that open their own type menu and their own
         transaction history, the balance box the sketch draws low on the card with the
         figure already standing in it, and Sign out on its own at the foot. It wears the
         admin hub's own card (.hub) because it is the same card — filled with the accent,
         every word on it in the accent ink, each door a pale box with a dark outline. -->
    <div class="page">
        <main class="hub">
            <h1 class="hub__brand">Bonura bank</h1>

            <!-- The greeting studenthome.js fills in: "Hi <student name>". Who is signed in
                 is not asked of the backend here — the front door's student door (app.js)
                 wrote the username it signed in with into sessionStorage, and this page
                 reads it back. The dots stand in until that has happened, and a browser
                 with no student behind it is explained on the status line under the door
                 rather than left as a greeting stuck on dots. -->
            <div class="hub__hello">
                <p class="hub__greeting">Hi <span id="studentname">&hellip;</span></p>
                <p class="hub__question">Would you like to:</p>
            </div>

            <!-- The two doors, side by side, and each opens a page of its own, so each is a
                 link. Add transaction opens the student's own type menu,
                 transaction_student_middle.html — the same four-type choice the admin's hub
                 opens through its own Add transaction, said in the student's flow
                 (data-flow="student") so nothing about it is written into sessionStorage and
                 the account behind the session cookie is the one a row would be for — and that
                 page refuses on its own when this browser holds no student session, with its
                 four type doors switched off, rather than offering a type to nobody. View
                 transaction history opens the admin's history page in the student's own form,
                 transaction-view-student.html, which reads GET /transaction-student-history
                 for the signed-in student; it too refuses on its own when this browser holds
                 no student session rather than opening on a table of nobody's rows. View
                 balance used to stand beside them and is gone: the balance is not something to
                 ask this card for any more, it is read as the card opens and stands at the
                 foot of it. With two doors the row is the hub's own two-column grid, so they
                 stand side by side and stack once they run out of width, as every other hub's
                 doors do. -->
            <nav class="hub__actions" aria-label="What you can do">
                <a class="btn btn--door" id="addtransaction" href="/transaction_student_middle.html">submit transactions</a>
                <a class="btn btn--door" id="viewhistory" href="/transaction-view-student.html">View transaction history</a>
            </nav>

            <!-- The balance box the sketch draws under the door, on the card from the moment
                 it opens: the balance the last transaction recorded for this student ended
                 on — the last row of GET /transaction-student-history — read by studenthome.js
                 while the page is opening, the dots standing in until that read answers. A
                 balance below zero is the one red, the way the students table draws one. A
                 browser with nobody signed in, an account the backend has recorded nothing
                 for, and a read that failed each put the box away rather than leave dots on
                 the card that will never turn into a figure. -->
            <p id="studentbalance" class="hub__balance"><span>Balance:
                <strong id="studentbalancefigure">&hellip;</strong></span></p>

            <!-- Everything the hub has to say: a greeting that could name nobody, a balance
                 that could not be read, a Sign out that did not go through. It takes no room
                 at all while it is empty, which is what the sketch draws. -->
            <p id="studentstatus" class="results" role="status" aria-live="polite"></p>

            <!-- The foot of the card, drawn the way the admin's hub draws it: Sign out on a
                 row of its own, pushed to the right, so it is never mistaken for a way
                 further in. There is nothing else that ends a session — the session lives in
                 the backend's cookie and not in a page — so the button posts POST /logout,
                 which empties that cookie whichever of the front door's two doors opened it,
                 and studenthome.js hands the browser back to the sign-in card. -->
            <div class="hub__foot">
                <button type="button" id="signout" class="btn btn--door">Sign out</button>
            </div>
        </main>
    </div>
</body>
</html>
