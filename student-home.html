<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonura bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap">
    <link rel="stylesheet" href="styles.css?v=12">
    <script src="studenthome.js?v=2" defer></script>
</head>
<body>
    <!-- The page behind the front door's student door, and the whole of it is the sketch's
         card: the bank's name, the greeting that names the student who is signed in, the
         question under it, the two doors, and the balance box the sketch draws low on the
         card. It wears the admin hub's own card (.hub) because it is the same card —
         filled with the accent, every word on it in the accent ink, each door a pale box
         with a dark outline. -->
    <div class="page">
        <main class="hub">
            <h1 class="hub__brand">Bonura bank</h1>

            <!-- The greeting studenthome.js fills in: "Hi <student name>". Who is signed in
                 is not asked of the backend here — the front door's student door (app.js)
                 wrote the username it signed in with into sessionStorage, and this page
                 reads it back. The dots stand in until that has happened, and a browser
                 with no student behind it is explained on the status line under the doors
                 rather than left as a greeting stuck on dots. -->
            <div class="hub__hello">
                <p class="hub__greeting">Hi <span id="studentname">&hellip;</span></p>
                <p class="hub__question">Would you like to:</p>
            </div>

            <!-- The two doors. View balance reads this student's own transaction history
                 — the same route the other door opens a page onto — and puts the balance
                 the last row of it ended on in the box under the doors, so it is a button:
                 the pale box the hub's doors and the transaction menu both wear, because it
                 is one of two equal choices, not the one button that commits anything. View
                 transaction history opens a page of its own — the admin's history page in
                 the student's own form, transaction-view-student.html, which reads
                 GET /transaction-student-history for the signed-in student — so it is a
                 link, and that page refuses on its own when this browser holds no student
                 session rather than opening on a table of nobody's rows. -->
            <nav class="hub__actions" aria-label="What you can do">
                <button type="button" id="viewbalance" class="btn btn--door">View balance</button>
                <a class="btn btn--door" id="viewhistory" href="/transaction-view-student.html">View transaction history</a>
            </nav>

            <!-- The balance box the sketch draws under the doors, read when View balance is
                 pressed: the balance the last transaction recorded for this student ended
                 on — the last row of GET /transaction-student-history — or the reason it
                 could not be read. It starts hidden, so the page as it opens is the first
                 sketch — the figure studenthome.js read fills it, and a balance below zero
                 is the one red, the way the students table draws one. -->
            <p id="studentbalance" class="hub__balance" hidden><span>Balance:
                <strong id="studentbalancefigure">&hellip;</strong></span></p>

            <!-- Everything the hub has to say: a greeting that could name nobody, a balance
                 that could not be read. It takes no room at all while it is empty, which is
                 what the sketch draws. -->
            <p id="studentstatus" class="results" role="status" aria-live="polite"></p>
        </main>
    </div>
</body>
</html>
