<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App1 · Query accounts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <div class="page">
        <main class="card">
            <header class="bar">
                <a class="brand" href="/index.html">
                    <span class="brand__dot" aria-hidden="true"></span>Bonura's Bank
                </a>
                <a class="tag" href="/index.html">&#8592; Home</a>
            </header>

            <h1 class="card__title">Query accounts</h1>
            <p class="card__hint">Filter by account name and/or supervisor. Leave a field blank to match everyone.</p>

            <form id="getusersform" class="form">
                <div class="field">
                    <label for="name">Account name <span class="hint">blank = everyone</span></label>
                    <input type="text" id="name" name="name" placeholder="Jane Doe">
                </div>

                <div class="field">
                    <label for="supervisor">Supervisor <span class="hint">blank = everyone</span></label>
                    <input type="text" id="supervisor" name="supervisor" placeholder="Morgan Lee">
                </div>

                <div class="form__actions">
                    <button type="submit" class="btn btn--primary">Search</button>
                    <button type="reset" class="btn btn--ghost">Clear</button>
                </div>
            </form>

            <div id="results" class="results" role="status" aria-live="polite"
                 data-empty="No results yet — run a search to list accounts."></div>
        </main>
    </div>
</body>
</html>
