<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App1 · Transaction</title>
    <link rel="stylesheet" href="styles.css">
    <script src="sessionstorage.js" defer></script>
</head>
<body>
    <div class="page">
        <main class="card">
            <header class="bar">
                <a class="brand" href="/index.html">
                    <span class="brand__dot" aria-hidden="true"></span>App1
                </a>
                <a class="tag" href="/index.html">&#8592; Home</a>
            </header>

            <h1 class="card__title">Transaction</h1>
            <p class="card__hint">Enter the student username to start a transaction for that account. Only a signed-in admin may open one, so the page asks the backend for permission as it loads.</p>

            <form id="transactionform" class="form">
                <div class="field">
                    <label for="student_username">Enter student username for transaction</label>
                    <input type="text" id="student_username" name="student_username" placeholder="jane.doe"
                           autocomplete="username" required>
                </div>

                <div class="form__actions">
                    <a class="btn btn--primary" id="transactionnext" href="/transaction-middle.html">Next</a>
                </div>
            </form>

            <div id="transactionsession" class="results" role="status" aria-live="polite"
                 data-empty="Asking the backend whether you are logged in&hellip;"></div>

            <p class="footnote">Need a login first? <a class="tag" href="/login_admin.html">Admin login</a></p>
        </main>
    </div>
</body>
</html>
