<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App1 · Transaction</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <div class="page">
        <main class="card">
            <header class="bar">
                <a class="brand" href="/index.html">
                    <span class="brand__dot" aria-hidden="true"></span>App1
                </a>
                <a class="tag" href="/index.html">&#8592; Home</a>
            </header>

            <h1 class="card__title">Transaction</h1>
            <p class="card__hint">Enter the student username to start a transaction for that account.</p>

            <form id="transactionform" class="form">
                <div class="field">
                    <label for="student_username">Enter student username for transaction</label>
                    <input type="text" id="student_username" name="student_username" placeholder="jane.doe"
                           autocomplete="username" required>
                </div>

                <div class="form__actions">
                    <a class="btn btn--primary" href="#">Next</a>
                </div>
            </form>
        </main>
    </div>
</body>
</html>
