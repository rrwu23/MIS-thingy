<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App1 · Add account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <div class="page">
        <main class="card">
            <header class="bar">
                <a class="brand" href="/index.html">
                    <span class="brand__dot" aria-hidden="true"></span>Bonura's Bank
                </a>
                <a class="tag" href="/index.html">&#8592; Home</a>
            </header>

            <h1 class="card__title">Add account</h1>
            <p class="card__hint">Creates a new account with a supervisor, an opening balance and a login password. The student's account username has to be typed twice, so a typo cannot quietly make an account nobody can find.</p>

            <form id="adduserform" class="form">
                <div class="field">
                    <label for="name">Name <span class="hint">the account's username</span></label>
                    <input type="text" id="name" name="name" autocomplete="name" required>
                </div>

                <!-- The safety check: app.js compares this with the Name field and
                     only posts when the two agree, then drops retype_name from the
                     request — /adduser takes name, initialbalance and password only. -->
                <div class="field">
                    <label for="retype_name">Retype student username <span class="hint">safety check</span></label>
                    <input type="text" id="retype_name" name="retype_name"
                           autocomplete="off" required>
                </div>

                <div class="field">
                    <label for="initialbalance">Initial balance</label>
                    <input type="text" id="initialbalance" name="initialbalance"
                           inputmode="decimal" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           autocomplete="new-password" required>
                </div>

                <div class="form__actions">
                    <button type="submit" class="btn btn--primary">Submit</button>
                    <button type="reset" class="btn btn--ghost">Clear</button>
                </div>
            </form>
        </main>
    </div>
</body>
</html>
