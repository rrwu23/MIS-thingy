<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App1 · Add account</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <div class="page">
        <main class="card">
            <header class="bar">
                <a class="brand" href="/index.html">
                    <span class="brand__dot" aria-hidden="true"></span>App1
                </a>
                <a class="tag" href="/index.html">&#8592; Home</a>
            </header>

            <h1 class="card__title">Add account</h1>
            <p class="card__hint">Creates a new account with a supervisor, an opening balance and a login password.</p>

            <form id="adduserform" class="form">
                <div class="field">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Jane Doe" autocomplete="name" required>
                </div>

                <div class="field">
                    <label for="initialbalance">Initial balance</label>
                    <input type="text" id="initialbalance" name="initialbalance" placeholder="0.00"
                           inputmode="decimal" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••"
                           autocomplete="new-password" required>
                </div>

                <div class="form__actions">
                    <button type="submit" class="btn btn--primary">Submit</button>
                    <button type="reset" class="btn btn--ghost">Clear</button>
                </div>
            </form>
        </main>
    </div>
</body>
</html>
