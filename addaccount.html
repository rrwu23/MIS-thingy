<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonura bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap">
    <link rel="stylesheet" href="styles.css?v=14">
    <script src="app.js?v=12" defer></script>
</head>
<body>
    <div class="page">
        <main class="card">
            <header class="bar">
                <h1 class="card__title">Bonura bank</h1>
                <a class="tag" href="/home.html">&#8592; Home</a>
            </header>

            <p class="card__hint"><strong>Add student.</strong> Creates a new account with a supervisor, a birthday, an opening balance and a login password. The student's account username has to be typed twice, so a typo cannot quietly make an account nobody can find.</p>

            <form id="adduserform" class="form">
                <div class="field">
                    <label for="name">Name <span class="hint">the account's username</span></label>
                    <input type="text" id="name" name="name" autocomplete="name" required>
                </div>

                <!-- The safety check: app.js compares this with the Name field and
                     only posts when the two agree, then drops retype_name from the
                     request — the server is sent the account's own fields (name,
                     birthday, initialbalance, password) and nothing else. -->
                <div class="field">
                    <label for="retype_name">Retype student username <span class="hint">safety check</span></label>
                    <input type="text" id="retype_name" name="retype_name"
                           autocomplete="off" required>
                </div>

                <!-- The student's birthday, kept with the account. Unlike retype_name
                     above this is real account data, so it is not dropped from the
                     request — it leaves for /adduser with name, initialbalance and
                     password. A date input is used rather than a free-text box because
                     the browser hands the value over in the one shape a date column
                     reads, YYYY-MM-DD, and offers a calendar instead of text that would
                     have to be parsed. app.js caps it at today, so a birthday still to
                     come cannot be picked or submitted. -->
                <div class="field">
                    <label for="birthday">Birthday <span class="hint">YYYY-MM-DD</span></label>
                    <input type="date" id="birthday" name="birthday" required>
                </div>

                <div class="field">
                    <label for="initialbalance">Initial balance</label>
                    <input type="text" id="initialbalance" name="initialbalance"
                           inputmode="decimal" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           autocomplete="new-password" required>
                </div>

                <div class="form__actions">
                    <button type="submit" class="btn btn--primary">Submit</button>
                    <button type="reset" class="btn btn--ghost">Clear</button>
                </div>
            </form>
        </main>
    </div>
</body>
</html>
