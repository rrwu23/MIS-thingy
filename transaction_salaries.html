<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App1 · Select salary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <div class="page">
        <main class="card">
            <header class="bar">
                <a class="brand" href="/index.html">
                    <span class="brand__dot" aria-hidden="true"></span>Bonura's Bank
                </a>
                <a class="tag" href="/index.html">&#8592; Home</a>
            </header>

            <section class="panel" aria-labelledby="reasontitle">
                <h1 class="panel__title" id="reasontitle">Select salary</h1>

                <!-- data-reason-type tells app.js which /reasons/{slug} list to
                     ask for: it carries the type column value exactly, so "JOB
                     SALARIES" asks for /reasons/job-salaries. The options below are
                     the fallback, kept in the dropdown whenever the backend cannot
                     answer; they are the exact reason column values, each one both
                     the value and the text. The live list comes back with the
                     amounts from the table's amount column, all positive: 45 up to
                     75. -->
                <select id="reason" name="reason" data-reason-type="JOB SALARIES" aria-label="Select salary">
                    <option value="" selected>Choose a salary&hellip;</option>
                    <option value="Attendance Monitor">Attendance Monitor</option>
                    <option value="Board Manager">Board Manager</option>
                    <option value="Calendar Helper">Calendar Helper</option>
                    <option value="Class Banker">Class Banker</option>
                    <option value="Class Greeter">Class Greeter</option>
                    <option value="Date Manager">Date Manager</option>
                    <option value="Errand Leader">Errand Leader</option>
                    <option value="Floor Cleaner">Floor Cleaner</option>
                    <option value="Librarian">Librarian</option>
                    <option value="Line Leader">Line Leader</option>
                    <option value="Lunch Helper">Lunch Helper</option>
                    <option value="Paper Collector">Paper Collector</option>
                    <option value="Paper Passer">Paper Passer</option>
                    <option value="Recycling Crew">Recycling Crew</option>
                    <option value="Supplies Manager">Supplies Manager</option>
                    <option value="Teacher Assistant">Teacher Assistant</option>
                    <option value="Tech Crew">Tech Crew</option>
                    <option value="Tidy Up Crew">Tidy Up Crew</option>
                </select>

                <div class="form__actions">
                    <button type="button" class="btn btn--primary" id="reasonnext" aria-disabled="true">
                        Next
                    </button>
                </div>
            </section>

            <div id="reasonresults" class="results" role="status" aria-live="polite"
                 data-empty="Asking the backend for the salary list&hellip;"></div>

            <p class="footnote">Wrong student? <a class="tag" href="/transaction-middle.html">&#8592; Back</a></p>
        </main>
    </div>
</body>
</html>
