<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonura bank · Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap">
    <link rel="stylesheet" href="styles.css?v=5">
    <script src="app.js?v=3" defer></script>
</head>
<body>
    <!-- index.html is the front door: the sign-in card, and nothing else. This is the
         page behind it — one card filled with the bank's teal, the way the sketch
         draws it: the bank's name, the greeting that names the admin who is signed in,
         the five doors in two columns, and Sign out on its own at the foot. Every
         finished flow in the app comes back here. -->
    <div class="page">
        <main class="hub">
            <h1 class="hub__brand">Bonura bank</h1>

            <!-- The greeting app.js fills in: "Hi <admin name>". GET /current-admin
                 answers which admin holds this browser's session cookie, and the dots
                 stand in until that answer arrives. A read that names nobody is
                 explained on the status line under the doors, rather than left as a
                 greeting stuck on dots. -->
            <div class="hub__hello">
                <p class="hub__greeting">Hi <span id="homeadminname">&hellip;</span></p>
                <p class="hub__question">Would you like to:</p>
            </div>

            <!-- The doors. Every one of them is a page of its own now, so all five are
                 links — View students opens students.html, where the students of this
                 admin and the balance on each account are listed as a table. Five doors
                 fill the grid two by two, which leaves Rotate jobs on a last row of its
                 own — it belongs on this card, being the one page the old foot-of-card
                 chips used to carry. -->
            <nav class="hub__actions" aria-label="What the bank can do">
                <a class="btn btn--door" href="/transaction1.html">Add transaction</a>
                <a class="btn btn--door" href="/addaccount.html">Add student</a>
                <button type="button" id="removestudent" class="btn btn--door">
                    Remove student
                </button>
                <a class="btn btn--door" href="/students.html">View students</a>
                <a class="btn btn--door" href="/job_rotation.html">Rotate jobs</a>
            </nav>

            <!-- Everything the hub has to say: a greeting that could name nobody, Remove
                 student with no route behind it, a Sign out that did not go through. -->
            <p id="homestatus" class="results" role="status" aria-live="polite"></p>

            <!-- The foot of the card. Query accounts, Add admin and Admin login are not
                 doors here: each is still reachable by its own URL, and the admin pair is
                 linked from the footnotes of transaction1.html and login_admin.html
                 themselves. Rotate jobs is one of the doors above, so no chip is left
                 along the foot. -->
            <div class="hub__foot">
                <button type="button" id="signout" class="btn btn--door">Sign out</button>
            </div>
        </main>
    </div>
</body>
</html>
