<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonura bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap">
    <link rel="stylesheet" href="styles.css?v=25">
    <script src="apibase.js?v=1" defer></script>
    <script src="app.js?v=27" defer></script>
</head>
<body>
    <!-- index.html is the front door: the sign-in card, and nothing else. This is the
         page behind it — one card filled with the bank's teal, the way the sketch
         draws it: the bank's name, the greeting that names the admin who is signed in,
         the nine doors in two columns, and Sign out on its own at the foot. Every
         finished flow in the app comes back here. -->
    <div class="page">
        <main class="hub">
            <h1 class="hub__brand">Bonura bank</h1>

            <!-- The greeting app.js fills in: "Hi <admin name>". GET /current-admin
                 answers which admin holds this browser's session cookie, and the dots
                 stand in until that answer arrives. A read that names nobody is
                 explained on the status line under the doors, rather than left as a
                 greeting stuck on dots. -->
            <div class="hub__hello">
                <p class="hub__greeting">Hi <span id="homeadminname">&hellip;</span></p>
                <p class="hub__question">Would you like to:</p>
            </div>

            <!-- The doors. Each of the nine opens a page of its own, so each is a link: View
                 students opens students.html, where the students of this admin, the balance
                 on each account, the job each of them has been given and the salary that job
                 pays are listed as a table, and the history door beside it
                 opens transaction-view-middle.html, which asks for the student name, and
                 whose Next pops up a table of all that student's transactions
                 (transaction-view.html). The doors fill the grid two by two, the ninth under
                 the last pair, and
                 Rotate jobs takes the sixth of them: it belongs on this card, being the one page the
                 old foot-of-card chips used to carry. The last two are the money doors, Pay salaries
                 and Pay rent, added beside it. -->
            <nav class="hub__actions" aria-label="What the bank can do">
                <a class="btn btn--door" href="/transaction1.html">Add transaction</a>
                <a class="btn btn--door" href="/addaccount.html">Add student</a>
                <!-- Remove student was the one door built as a <button>, because there was
                     nothing behind it but a line on the status strip below. It opens
                     remove.html now: that page asks for the student's name, puts the
                     question — Yes or No — in front of the admin, and, on an answered Yes,
                     sends the name to POST /remove-student and reports what came of it. -->
                <a class="btn btn--door" href="/remove.html">Remove student</a>
                <a class="btn btn--door" href="/students.html">View students</a>
                <!-- The one door on this card that asks about what has already been
                     recorded rather than what is about to be: it stands beside View
                     students, because it is the same question about the same students —
                     which one — answered by the same backend routes. It is a link, so
                     app.js knows nothing about it: the page it opens refuses on its own
                     when this browser holds no admin session. -->
                <a class="btn btn--door" href="/transaction-view-middle.html">View student transaction history</a>
                <!-- The door that was added beside the history one, and about the same
                     students: the transactions they have asked for, one row each, with
                     Approve and Decline at the end of every row. approve_transactions.html
                     reads them from GET /getsubmittransaction — the route the backend has
                     yet to answer — and answers each row by writing it into the
                     transaction table (POST /transaction-record) or taking it off the
                     submission list (POST /removesubmittransaction). Like the doors beside
                     it, it is a plain link, so app.js knows nothing about it: the page
                     refuses on its own when this browser holds no admin session. -->
                <a class="btn btn--door" href="/approve_transactions.html">Approve transactions</a>
                <a class="btn btn--door" href="/job_rotation.html">Rotate jobs</a>
                <!-- The two money doors, at the foot of the grid: each opens a page of its own —
                     salary.html and rent.html, one script behind both — where the students of the
                     signed-in admin are listed in a box and the ticked ones are paid the salary of
                     their job (POST /pay-salary) or charged the rent (POST /pay-rent), one student at
                     a time. Like the history door beside them they are plain links, so app.js knows
                     nothing about them: each page refuses on its own when this browser holds no admin
                     session. -->
                <a class="btn btn--door" href="/salary.html">Pay salaries</a>
                <a class="btn btn--door" href="/rent.html">Pay rent</a>
            </nav>

            <!-- Everything the hub has to say: a greeting that could name nobody, a Sign out
                 that did not go through. -->
            <p id="homestatus" class="results" role="status" aria-live="polite"></p>

            <!-- The foot of the card. Query accounts, Add admin and Admin login are not
                 doors here: each is still reachable by its own URL, and nothing in the app
                 links to them — the "Need a login first?" footnotes that used to point at
                 the admin login from transaction1.html, students.html and job_rotation.html
                 are gone. Rotate jobs is one of the doors above, so no chip is left along
                 the foot. -->
            <div class="hub__foot">
                <button type="button" id="signout" class="btn btn--door">Sign out</button>
            </div>
        </main>
    </div>
</body>
</html>
