<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonura bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap">
    <link rel="stylesheet" href="styles.css?v=26">
    <script src="apibase.js?v=1" defer></script>
    <script src="app.js?v=33" defer></script>
</head>
<!-- The student's own expense page: transaction_spending.html to the letter — the same card, the
     same dropdown of ways to spend, the same date box, the same Next and the same status line —
     with the student flow's two words in it. data-flow="student" on the <body> is how app.js is
     told which flow this is (the same way the two history pages say data-history), and it changes
     exactly two things about the page:

         the student is not typed, picked or stored. Who the row is submitted for is the account
         behind the session cookie, read from the backend as the page opens and again at the last
         moment before the row leaves —
             GET /current-student
         — so nothing of this flow is in sessionStorage at all, and a browser with no student
         behind it is told so on the status line below, with the dropdown and Next switched off.

         the submit goes to POST /add-transaction-submit. That is the route the backend has yet to
         answer — it is not in https://api.rongrongwu.com/openapi.json and the API answers
         404 {"detail": "Not Found"} to it, checked live — so the row waits for an admin on the
         approvals page until it answers; the admin's own page records there and then, through
         POST /transaction-record. Nothing else about the body differs: the same five fields,
         built by the same functions.

     Everything else is the admin's page's own, read the same way: the reason list asked for, the
     built-in options below, the sign the figures carry and the shape of the date. -->
<body data-flow="student">
    <div class="page">
        <main class="card">
            <header class="bar">
                <h1 class="card__title">Bonura bank</h1>
                <a class="tag" href="/student-home.html">&#8592; Home</a>
            </header>

            <section class="panel" aria-labelledby="reasontitle">
                <!-- The page's own name, which used to be a heading — the card's heading is
                     the bank's name now — kept with the id the panel is labelled by. -->
                <p class="panel__title" id="reasontitle">Select expense</p>

                <!-- data-reason-type tells app.js which /reasons/{slug} list to
                     ask for: it carries the type column value exactly, so "WAYS TO
                     SPEND BONURA BUCKS" asks for
                     /reasons/ways-to-spend-bonura-bucks. The options below are the
                     fallback, kept in the dropdown whenever the backend cannot
                     answer; they are the exact reason column values, each one both
                     the value and the text. The live list comes back with the
                     amounts from the table's amount column: 2 up to 200. Those are
                     money out, so app.js signs them negative: the dropdown shows
                     "(-2 pts)" and the transaction carries -2. A fallback option
                     above has no amount at all, and nothing is invented for it.
                     data-transaction-type is what the approved row is filed under
                     instead - the type column of the history table as this card
                     wants it read. It is kept apart from data-reason-type so that
                     the plain word on the row ("expense") does not have to be a
                     route on the API: the list and the sign are read from
                     data-reason-type alone, which is why the signed figures below
                     still come out negative. -->
                <select id="reason" name="reason" data-reason-type="WAYS TO SPEND BONURA BUCKS"
                        data-transaction-type="expense" aria-label="Select expense">
                    <option value="" selected>Choose an expense&hellip;</option>
                    <option value="Add pencil">Add pencil</option>
                    <option value="Colouring books">Colouring books</option>
                    <option value="Dress up silly goose">Dress up silly goose</option>
                    <option value="Extra computer time">Extra computer time</option>
                    <option value="Homework pass">Homework pass</option>
                    <option value="Ice cream">Ice cream</option>
                    <option value="Movie">Movie</option>
                    <option value="Pen pass">Pen pass</option>
                    <option value="Phys. ed. game">Phys. ed. game</option>
                    <option value="Popcorn Party">Popcorn Party</option>
                    <option value="Prize Bin">Prize Bin</option>
                    <option value="Pyjama Day">Pyjama Day</option>
                    <option value="Swish or Miss">Swish or Miss</option>
                    <option value="Toy">Toy</option>
                    <option value="Toy car">Toy car</option>
                    <option value="VIP desk (1 day)">VIP desk (1 day)</option>
                    <option value="Yes Day (classroom)">Yes Day (classroom)</option>
                </select>

                <!-- The row's date, picked rather than stamped when Next is pressed: the
                     browser's own day-and-clock box — the birthday box on addaccount.html is
                     its plain day side, without the clock — which app.js fills from the clock
                     as the page loads, so it starts at now. Its calendar is how the row is
                     filed under another day: every day of every month is on it, January 1st
                     through December 31st, and the months and years around them are walked
                     by the control itself. app.js re-cuts what it holds into the history
                     page's own Date column shape, YYYY/MM/DD HH:mm — a day it holds with no time
                     on it is filed at 00:00, the time of day being the one part of the stamp
                     this page may leave off — and refuses a box that holds no whole day,
                     saying so on the status line below. -->
                <div class="field">
                    <label for="transactiondate">Date <span class="hint">the day and time it happened</span></label>
                    <input type="datetime-local" id="transactiondate" name="date">
                </div>

                <div class="form__actions">
                    <button type="button" class="btn btn--primary" id="reasonnext" aria-disabled="true">
                        Next
                    </button>
                </div>
            </section>

            <div id="reasonresults" class="results" role="status" aria-live="polite"
                 data-empty="Asking the backend for the expense list&hellip;"></div>

            <p class="footnote">Wrong account? <a class="tag" href="/transaction_student_middle.html">&#8592; Back</a></p>
        </main>
    </div>
</body>
</html>
